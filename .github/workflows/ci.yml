name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-checks:
    # The plugin holds no code, so its checks live in r9s9/docforge-toolkit
    # (plugin_checks/) and run here against this repository. They also set
    # the toolkit up by following SKILL.md and run the workflows with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: r9s9/docforge-toolkit
          path: toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the checks
        run: python -m pip install ./toolkit pytest==9.2.0
      - name: Plugin checks
        run: python -m pytest toolkit/plugin_checks --plugin plugin -p no:cacheprovider
