name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r engine/requirements.txt pytest==9.2.0 ruff==0.17.3
      - name: Skill copies match engine/ and fit the directory limits
        run: python tools/build.py --check
      - name: Engine matches its upstream lock
        run: python tools/sync_upstream.py --verify
      - name: Lint
        run: ruff check engine/docforge/toolkit engine/docforge_cli.py tools tests
      - name: Tests
        run: pytest -q

  upstream-parity:
    # DocForge's own engine tests, run against the plugin's copy of the engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the upstream commit
        id: lock
        run: echo "commit=$(python3 -c 'import json;print(json.load(open("engine/upstream.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: r9s9/docforge
          ref: ${{ steps.lock.outputs.commit }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r engine/requirements.txt pytest==9.2.0
      - name: Run upstream engine tests on the copy
        run: python tools/run_upstream_tests.py --from upstream
